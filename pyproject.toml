[project]
name = "dgm-arca"
version = "0.2.0"
description = "ARCA: Agente con Razonamiento, Conocimiento y Acción. Práctica final de Modelos Generativos Profundos (MIA, ICAI)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Equipo docente de Modelos Generativos Profundos, ICAI" }]
dependencies = [
    "requests>=2.32",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "tool_use"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
